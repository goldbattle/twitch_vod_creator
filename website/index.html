<!DOCTYPE html>
<html lang="en">

<head>

  <!-- meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- style files -->
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/bootstrap-nightfall.css" media="(prefers-color-scheme: dark)">

  <style>
    .resizable-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .resizable-panel {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .resizer {
      background-color: #dee2e6;
      cursor: col-resize;
      width: 4px;
      flex-shrink: 0;
      user-select: none;
    }

    .resizer:hover {
      background-color: #adb5bd;
    }

    .resizer.dragging {
      background-color: #6c757d;
    }

    #video-panel {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #transcript-panel {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #segments-panel {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .segment-highlight {
      scroll-margin-top: 20px;
    }
  </style>

  <!-- javascript files -->
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="js/clipboard.min.js"></script>
  <script type="text/javascript" src="js/popper.min.js"></script>

</head>

<body>
  <div class="resizable-container">
    <!-- main video panel -->
    <div class="resizable-panel" id="video-panel">
      <h2 id="title"></h2>
      <h3 id="date" class="text-muted"></h3>
      <div class="input-group">
        <span class="input-group-text" style="border-radius:0.2rem 0 0 0;">Current Video:</span>
        <input class="form-control form-control-lg" id="datapath" onkeydown="readInputDataPath(this, event)"
          style="border-radius:0 0.2rem 0 0;" />
      </div>

      <div class="embed-responsive embed-responsive-16by9">
        <video width="100%" id="video-active" class="embed-responsive-item" preload="auto" controls>
          <!-- <source src="path_here.." type="video/mp4"> -->
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <!-- resizer between video and transcript -->
    <div class="resizer" id="resizer-video-transcript"></div>

    <!-- transcript text panel -->
    <div class="resizable-panel" id="transcript-panel">
      <div id="transcript" style="font-size: 0.8em;word-wrap: break-word;overflow-y: auto; flex: 1; padding: 1rem;">
      </div>
    </div>

    <!-- resizer between transcript and segments -->
    <div class="resizer" id="resizer-transcript-segments"></div>

    <!-- rendered segments panel -->
    <div class="resizable-panel" id="segments-panel">
      <a class="btn btn-primary d-grid mb-2" id="copybutton" style="margin: 1rem;">COPY TEXT</a>
      <code id="segments" class="text-body" style="padding: 1rem; display: block;">Add segments with "A"!</code>
    </div>

    <!-- error alert -->
    <div class="position-fixed top-50 start-50 translate-middle p-3" style="z-index: 11">
      <div id="error-toast" class="toast hide align-items-center text-white bg-danger border-0" role="alert"
        aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body text-center" id="error-toast-body">
          </div>
          <!-- <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button> -->
        </div>
      </div>
    </div>
  </div>




  <script>

    var transcriptScoll = true;
    var lastScrollTime = new Date();
    var transcriptLast = 0;
    var transcriptItems = [];
    var segments = [];
    var segmentCurrent = 1;
    var playedGameItems = [];
    var extraTitleStuff = "";
    var transcriptWindowStart = 0;  // Start index of visible window
    var transcriptWindowEnd = 0;    // End index of visible window
    var BUFFER_WINDOW_SECONDS = 15 * 60;  // 15 minutes in seconds
    var GAP_THRESHOLD_SECONDS = 2.0;  // Gap threshold in seconds for grouping items

    // Panel resizing functionality
    function initResizablePanels() {
      const resizer1 = document.getElementById('resizer-video-transcript');
      const resizer2 = document.getElementById('resizer-transcript-segments');
      const videoPanel = document.getElementById('video-panel');
      const transcriptPanel = document.getElementById('transcript-panel');
      const segmentsPanel = document.getElementById('segments-panel');

      // Get initial widths from URL or use defaults
      const urlParams = new URLSearchParams(window.location.search);
      const videoWidth = urlParams.get('vw') || '50.0'; // default 50%
      const segmentsWidth = urlParams.get('sw') || '30.0'; // default 30%
      const transcriptWidth = urlParams.get('tw') || '20.0'; // default 20% (100 - 50 - 30)

      videoPanel.style.width = videoWidth + '%';
      transcriptPanel.style.width = transcriptWidth + '%';
      segmentsPanel.style.width = segmentsWidth + '%';

      let activeResizer = null;
      let isResizing = false;

      function setupResizer(resizer, leftPanel, rightPanel, isFirstResizer) {
        resizer.addEventListener('mousedown', (e) => {
          isResizing = true;
          activeResizer = resizer;
          resizer.classList.add('dragging');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
        });
      }

      setupResizer(resizer1, videoPanel, transcriptPanel, true);
      setupResizer(resizer2, transcriptPanel, segmentsPanel, false);

      document.addEventListener('mousemove', (e) => {
        if (!isResizing || !activeResizer) return;

        const containerWidth = document.querySelector('.resizable-container').offsetWidth;
        const mouseX = e.clientX;
        const mouseXPercent = (mouseX / containerWidth) * 100;

        if (activeResizer === resizer1) {
          // Resizing between video and transcript
          const currentVideoWidth = parseFloat(videoPanel.style.width);
          const currentTranscriptWidth = parseFloat(transcriptPanel.style.width);
          const currentSegmentsWidth = parseFloat(segmentsPanel.style.width);

          const newVideoWidth = mouseXPercent;
          const remainingWidth = 100 - newVideoWidth;

          // Limit video width (20% to 70%)
          if (newVideoWidth >= 20 && newVideoWidth <= 70) {
            // Maintain ratio between transcript and segments
            const totalRightWidth = currentTranscriptWidth + currentSegmentsWidth;
            const transcriptRatio = currentTranscriptWidth / totalRightWidth;
            const segmentsRatio = currentSegmentsWidth / totalRightWidth;

            videoPanel.style.width = newVideoWidth + '%';
            transcriptPanel.style.width = (remainingWidth * transcriptRatio) + '%';
            segmentsPanel.style.width = (remainingWidth * segmentsRatio) + '%';

            updateURLParameter('vw', newVideoWidth.toFixed(2));
            updateURLParameter('tw', (remainingWidth * transcriptRatio).toFixed(2));
            updateURLParameter('sw', (remainingWidth * segmentsRatio).toFixed(2));
          }
        } else if (activeResizer === resizer2) {
          // Resizing between transcript and segments
          const currentVideoWidth = parseFloat(videoPanel.style.width);
          const currentTranscriptWidth = parseFloat(transcriptPanel.style.width);
          const currentSegmentsWidth = parseFloat(segmentsPanel.style.width);

          // Calculate where the transcript panel starts
          const transcriptStartPercent = currentVideoWidth;
          const transcriptEndPercent = transcriptStartPercent + currentTranscriptWidth;

          // Mouse position relative to transcript start
          const relativeMouseX = mouseXPercent - transcriptStartPercent;
          const totalRightWidth = 100 - currentVideoWidth;

          // New transcript width based on mouse position
          const newTranscriptWidth = relativeMouseX;
          const newSegmentsWidth = totalRightWidth - newTranscriptWidth;

          // Limit widths (each panel needs at least 5%)
          if (newTranscriptWidth >= 5 && newSegmentsWidth >= 5) {
            transcriptPanel.style.width = newTranscriptWidth + '%';
            segmentsPanel.style.width = newSegmentsWidth + '%';

            updateURLParameter('tw', newTranscriptWidth.toFixed(2));
            updateURLParameter('sw', newSegmentsWidth.toFixed(2));
          }
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          if (activeResizer) {
            activeResizer.classList.remove('dragging');
          }
          activeResizer = null;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    }

    function updateURLParameter(key, value) {
      const url = new URL(window.location);
      url.searchParams.set(key, value);
      window.history.replaceState({}, '', url);
    }

    function createTimestampSpan(time) {
      // Create a clickable timestamp span in gray text
      return "<span onclick=\"document.querySelector('#video-active').currentTime = " + time + "; onTrackedVideoFrame(" + time + ", document.querySelector('#video-active').duration);\" style=\"color: #6c757d; cursor: pointer; margin-right: 0.5em;\" title=\"Seek to " + toHHMMSS(time) + "\">[" + toHHMMSS(time) + "]</span>";
    }

    function updateTranscriptWindow(currentTime) {
      // Calculate window bounds: 15 minutes before and after current time
      var windowStart = Math.max(0, currentTime - BUFFER_WINDOW_SECONDS);
      var windowEnd = currentTime + BUFFER_WINDOW_SECONDS;

      // Find the indices that fall within this window
      var newStart = 0;
      var newEnd = transcriptItems.length - 1;

      // Find first item that ends at or after windowStart
      for (var i = 0; i < transcriptItems.length; i++) {
        if (transcriptItems[i]["endTime"] >= windowStart) {
          newStart = i;
          break;
        }
      }

      // Find last item that starts before or at windowEnd
      for (var i = transcriptItems.length - 1; i >= 0; i--) {
        if (transcriptItems[i]["startTime"] <= windowEnd) {
          newEnd = i;
          break;
        }
      }

      // Only update if the window has changed (we've moved outside current bounds)
      var needsUpdate = false;

      if (transcriptWindowStart === 0 && transcriptWindowEnd === 0) {
        // Initial load - always update
        needsUpdate = true;
      } else if (newStart < transcriptWindowStart || newEnd > transcriptWindowEnd) {
        // We've moved outside the current window - need to update
        needsUpdate = true;
      }

      if (needsUpdate) {
        // Clear existing transcript
        $("#transcript").empty();

        // Render items within the window
        var currentPlayedGame = 0;
        var last_timestamp = 0.0;
        for (var i = newStart; i <= newEnd && i < transcriptItems.length; i++) {
          // Add game headers that fall within or before this window
          while (currentPlayedGame < playedGameItems.length &&
            playedGameItems[currentPlayedGame]["startTime"] <= transcriptItems[i]["startTime"]) {
            // Only add if it's within or just before the window (within 1 minute before)
            if (playedGameItems[currentPlayedGame]["startTime"] >= windowStart - 60) {
              var gameTime = playedGameItems[currentPlayedGame]["startTime"];
              $("#transcript").append("<h4 id=\"game_" + currentPlayedGame + "\" style=\"margin-top:1rem;cursor:pointer;text-decoration:underline;\" class=\"fw-bold text-warning\" onclick=\"onGamePlayedSeekClick(" + gameTime + ",'game_" + currentPlayedGame + "');\">" + createTimestampSpan(gameTime) + playedGameItems[currentPlayedGame]["text"] + '</h4>');
            }
            currentPlayedGame = currentPlayedGame + 1;
          }

          // Check if this is the start of a new line grouping
          var isNewGroup = (i == newStart) || (last_timestamp > 0.0 && transcriptItems[i]["startTime"] - last_timestamp > GAP_THRESHOLD_SECONDS);

          // Add spacing if there's a gap
          if (last_timestamp > 0.0 && transcriptItems[i]["startTime"] - last_timestamp > GAP_THRESHOLD_SECONDS) {
            $("#transcript").append("<br/><br/>");
          }

          // Add the transcript item with timestamp only at the start of a new group
          var timestampHtml = isNewGroup ? createTimestampSpan(transcriptItems[i]["startTime"]) : "";
          $("#transcript").append(timestampHtml + "<span id=\"item_" + i + "\" onclick=\"onWordSeekClick(" + i + ");\" style=\"cursor:pointer;\">" + transcriptItems[i]["text"] + '</span> ');
          last_timestamp = transcriptItems[i]["endTime"];
        }

        transcriptWindowStart = newStart;
        transcriptWindowEnd = newEnd;
      }
    }

    function updateTranscript(index, force = false) {
      // Update the visible window if needed
      if (transcriptItems.length > 0 && index < transcriptItems.length) {
        var currentTime = transcriptItems[index]["startTime"];
        updateTranscriptWindow(currentTime);
      }

      if (transcriptLast != index || force) {

        // Remove old transcript if needed, add new highlight
        if ($("#item_" + transcriptLast).length > 0 && $("#item_" + transcriptLast).hasClass("text-info")) {
          $("#item_" + transcriptLast).removeClass("text-info")
        }
        if ($("#item_" + index).length > 0) {
          $("#item_" + index).addClass("text-info")
        }

        // https://stackoverflow.com/q/40243455/7718197
        //var codeElement = document.querySelector("#item_" + index);
        //var scrollableContainer = document.querySelector("#transcript");
        //var scrollableContainerHeight = scrollableContainer.clientHeight;
        //var offsetTop = codeElement.offsetTop;
        //var diff = offsetTop - scrollableContainerHeight;
        //targetScrollTop = diff + (scrollableContainerHeight / 2);
        // https://stackoverflow.com/a/62044232/7718197
        if (transcriptScoll && $("#item_" + index).length > 0) {
          lastScrollTime = new Date();
          //$('#transcript').animate({scrollTop: targetScrollTop}, 100, 'swing');
          document.getElementById("item_" + index).scrollIntoView({
            behavior: 'auto',
            block: 'center',
            inline: 'center'
          });
        }

      }
      transcriptLast = index;

    }

    function toHHMMSS(secs) {
      var sec_num = parseInt(secs, 10)
      var hours = Math.floor(sec_num / 3600)
      var minutes = Math.floor(sec_num / 60) % 60
      var seconds = sec_num % 60
      return String(hours).padStart(2, '0') + ":" +
        String(minutes).padStart(2, '0') + ":" +
        String(seconds).padStart(2, '0');
    }

    function onTrackedVideoFrame(currentTime, duration) {
      //$("#current").text(currentTime);
      //$("#duration").text(duration);
      // for (var i = 0; i < transcriptItems.length; i++) {
      //   if(currentTime >= transcriptItems[i]["startTime"] && currentTime < transcriptItems[i]["endTime"]) {
      //     //$("#text").text(transcriptItems[i]["text"]);
      //     updateTranscript(i);
      //     console.log("found -> " + i)
      //     break
      //   }
      // }
      // https://stackoverflow.com/a/57411916/7718197
      if (transcriptItems.length > 0) {
        const getClosest = (data, target) =>
          data.reduce((acc, obj) =>
            Math.abs(target - obj["startTime"]) < Math.abs(target - acc["startTime"]) ? obj : acc
          );
        //console.log("new -> "+ getClosest(transcriptItems, currentTime)["index"]);
        updateTranscript(getClosest(transcriptItems, currentTime)["index"]);
      }

    }

    function onWordSeekClick(index) {
      if (index >= transcriptItems.length || index < 0)
        return false
      updateTranscript(index);
      document.querySelector('#video-active').currentTime = transcriptItems[index]["startTime"]
      return false
    }

    function onGamePlayedSeekClick(time, id) {
      document.querySelector('#video-active').currentTime = time
      if (transcriptScoll) {
        document.getElementById(id).scrollIntoView({
          behavior: 'auto',
          block: 'center',
          inline: 'center'
        });
      }
      return false
    }

    function removeOnScrollButton() {
      transcriptScoll = true;
      $("#resume_scroll").remove();
      updateTranscript(transcriptLast, true);
      return false;
    }

    function readInputDataPath(el, e) {
      if (e.keyCode == 13) {
        const urlParams = new URLSearchParams(window.location.search);
        const vw = urlParams.get('vw') || '50.0';
        const sw = urlParams.get('sw') || '30.0';
        const tw = urlParams.get('tw') || '20.0';
        location.href = "/?file=" + el.value + "&vw=" + vw + "&tw=" + tw + "&sw=" + sw;
      }
    }

    // https://github.com/pavladan/subtitles-parser-vtt/blob/master/index.js#L67
    function timeMs(val) {
      var regex = /(\d+):(\d{2}):(\d{2})[,.](\d{3})/;
      var parts = regex.exec(val);
      if (parts === null) {
        return 0;
      }
      for (var i = 1; i < 5; i++) {
        parts[i] = parseInt(parts[i], 10);
        if (isNaN(parts[i])) parts[i] = 0;
      }
      // hours + minutes + seconds + ms
      return parts[1] * 3600000 + parts[2] * 60000 + parts[3] * 1000 + parts[4];
    };


    function updateSegmentYaml() {
      var text = updateSegmentYamlGenerate(false, "<br/>", "&nbsp;", true);
      $("#segments").html(text);
      var text2 = updateSegmentYamlGenerate(true, "\n", " ");
      $('#copybutton').attr('data-clipboard-text', text2)

      // Auto-scroll to current segment within segments panel
      setTimeout(function () {
        var currentSegmentId = segmentCurrent == -1 ? segments.length - 1 : segmentCurrent;
        var segmentElement = document.getElementById('segment_' + currentSegmentId);
        var segmentsPanel = document.getElementById('segments-panel');
        if (segmentElement && segmentsPanel) {
          var segmentTop = segmentElement.offsetTop;
          var segmentHeight = segmentElement.offsetHeight;
          var panelHeight = segmentsPanel.clientHeight;
          var scrollTop = segmentTop - (panelHeight / 2) + (segmentHeight / 2);
          segmentsPanel.scrollTo({
            top: scrollTop,
            behavior: 'smooth'
          });
        }
      }, 100);
    }

    function updateSegmentYamlGenerate(reverse, lineending, space, highlight = false) {
      var text = "";
      if (reverse) {
        segments.reverse();
      }
      for (var i = segments.length - 1; i >= 0; i--) {
        var segmentId = 'segment_' + i;
        var segmentClass = highlight && (i == segmentCurrent || (segmentCurrent == -1 && i == segments.length - 1))
          ? 'segment-highlight' : '';
        text += "<div id=\"" + segmentId + "\" class=\"" + segmentClass + "\">";
        if (highlight && (i == segmentCurrent || (segmentCurrent == -1 && i == segments.length - 1))) {
          text += "<span class=\"text-warning\" style=\"font-weight: bold;\">"
        }
        text += "- video: " + document.querySelector('#datapath').value + lineending
        text += space + space + "title: \"" + segments[i]["title"] + "\"" + lineending
        text += space + space + "t_start: \""
        for (var j = 0; j < segments[i]["start"].length; j++) {
          text += toHHMMSS(segments[i]["start"][j]);
          if (j < segments[i]["start"].length - 1) {
            text += ",";
          }
        }
        text += "\"" + lineending
        text += space + space + "t_end: \""
        for (var j = 0; j < segments[i]["end"].length; j++) {
          text += toHHMMSS(segments[i]["end"][j]);
          if (j < segments[i]["end"].length - 1) {
            text += ",";
          }
        }
        text += "\"" + lineending + lineending
        if (highlight && (i == segmentCurrent || (segmentCurrent == -1 && i == segments.length - 1))) {
          text += "</span>"
        }
        text += "</div>";
      }
      if (reverse) {
        segments.reverse();
      }
      return text;
    }

    //===========================================
    //===========================================
    //===========================================

    // $(window).resize(function () {
    //   $('#transcript').height($('#video').height());
    // });

    $("#video-active").on(
      "timeupdate",
      function (event) {
        onTrackedVideoFrame(this.currentTime, this.duration);
      }
    );

    // $("#transcript").scroll(function(e) {
    //   if(((new Date()) - lastScrollTime) / 1000.0 > 0.25 && !$('#resume_scroll').length) {
    //     $("#transcript-container").append("<a class=\"btn btn-primary btn-lg d-grid\" id=\"resume_scroll\" onclick=\"removeOnScrollButton();\" style=\"border-radius:0 0 0.2rem 0.2rem;\">Resume Scroll</a>")
    //     transcriptScoll = false;
    //   }
    // });


    // http://gcctech.org/csc/javascript/javascript_keycodes.htm
    var theVideo = document.querySelector('#video-active');
    document.onkeydown = function (event) {

      // Don't do key events if we are in a form input
      if (document.activeElement.tagName === "INPUT") {
        return
      }

      // T: ask user for the title
      if (event.keyCode == 84) {
        event.preventDefault();
        if (segments.length > 0) {
          var title = prompt("Current Segment Title", segments.at(segmentCurrent)["title"]);
          segments.at(segmentCurrent)["title"] = title;
          updateSegmentYaml();
        }
      }

      // A: create new segment
      if (event.keyCode == 65) {
        event.preventDefault();
        //if(segments.length > 0 && segments.at(segmentCurrent)["start"].length != segments.at(segmentCurrent)["end"].length) {
        //  console.log("can't add new segment till last is finished")
        //  $("#error-toast-body").html("<h2>Finish the current segment!</h2>");
        //  (new bootstrap.Toast(document.getElementById('error-toast'), {delay: 1000})).show();
        //} else {
        segments.push({ start: [theVideo.currentTime], end: [], title: extraTitleStuff })
        segmentCurrent = -1;
        updateSegmentYaml();
      }

      // S: append new start time
      if (event.keyCode == 83) {
        event.preventDefault();
        if (segments.length < 1) {
          segments.push({ start: [theVideo.currentTime], end: [], title: "" })
        } else {
          var found = false;
          var timestamp = theVideo.currentTime;
          for (var i = 0; i < segments.at(segmentCurrent)["start"].length; i++) {
            if (segments.at(segmentCurrent)["start"].at(i) == timestamp) {
              found = true;
              break;
            }
          }
          if (segments.at(segmentCurrent)["start"].length > segments.at(segmentCurrent)["end"].length) {
            console.log("can't add another start before adding the previous end")
            $("#error-toast-body").html("<h2>Add another END before starting!</h2>");
            (new bootstrap.Toast(document.getElementById('error-toast'), { delay: 1000 })).show();
          } else if (!found) {
            segments.at(segmentCurrent)["start"].push(timestamp)
          }
        }
        updateSegmentYaml();
      }

      // D: append new end time
      if (event.keyCode == 68) {
        event.preventDefault();
        if (segments.length < 1) {
          segments.push({ start: [theVideo.currentTime], end: [], title: "" })
        } else {
          var found = false;
          var timestamp = theVideo.currentTime;
          for (var i = 0; i < segments.at(segmentCurrent)["end"].length; i++) {
            if (segments.at(segmentCurrent)["end"].at(i) == timestamp) {
              found = true;
              break;
            }
          }
          if (segments.at(segmentCurrent)["end"].length >= segments.at(segmentCurrent)["start"].length) {
            console.log("can't add another end before adding a new start")
            $("#error-toast-body").html("<h2>Add another START before starting!</h2>");
            (new bootstrap.Toast(document.getElementById('error-toast'), { delay: 1000 })).show();
          } else if (!found) {
            segments.at(segmentCurrent)["end"].push(timestamp)
          }
        }
        updateSegmentYaml();
      }

      // up arrow
      if (event.keyCode == 38) {
        event.preventDefault();
        if (segmentCurrent != -1) {
          segmentCurrent = segmentCurrent + 1;
          if (segmentCurrent >= segments.length) {
            segmentCurrent = -1;
          }
          updateSegmentYaml();
        }
      }

      // down arrow
      if (event.keyCode == 40) {
        event.preventDefault();
        if (segmentCurrent != -1) {
          segmentCurrent = segmentCurrent - 1;
          if (segmentCurrent < 0) {
            segmentCurrent = 0;
          }
        } else if (segments.length > 1) {
          segmentCurrent = segments.length - 2
        }
        updateSegmentYaml();
      }


      // space bar
      if (event.keyCode == 32) {
        event.preventDefault();
        if (theVideo.paused) {
          theVideo.play();
        } else {
          theVideo.pause();
        }
      }

      // left arrow
      if (event.keyCode == 37 && !event.ctrlKey && !event.altKey) {
        event.preventDefault();
        theVideo.currentTime = theVideo.currentTime - 10;
      }

      // right arrow
      if (event.keyCode == 39 && !event.ctrlKey && !event.altKey) {
        event.preventDefault();
        theVideo.currentTime = theVideo.currentTime + 10;
      }

      // left arrow + cntrl
      if (event.keyCode == 37 && event.ctrlKey) {
        event.preventDefault();
        theVideo.currentTime = theVideo.currentTime - 60;
        onTrackedVideoFrame(theVideo.currentTime, theVideo.duration)
      }

      // right arrow + cntrl
      if (event.keyCode == 39 && event.ctrlKey) {
        event.preventDefault();
        theVideo.currentTime = theVideo.currentTime + 60;
        onTrackedVideoFrame(theVideo.currentTime, theVideo.duration)
      }

      // left arrow + alt
      if (event.keyCode == 37 && event.altKey) {
        event.preventDefault();
        theVideo.currentTime = theVideo.currentTime - 300;
        onTrackedVideoFrame(theVideo.currentTime, theVideo.duration)
      }

      // right arrow + alt
      if (event.keyCode == 39 && event.altKey) {
        event.preventDefault();

    $(document).ready(function () {

      // Initialize resizable panels
      initResizablePanels();

      // Create clipboard object
      // https://clipboardjs.com/
      var clipboard = new ClipboardJS('#copybutton');

      // Get what video we are currently loading!
      const urlParams = new URLSearchParams(window.location.search);
      const filepath = urlParams.get('file');
      if (filepath) {
        document.querySelector('#video-active').setAttribute('src', filepath + ".mp4");
        document.querySelector('#datapath').value = filepath;
      }

      // This will load our info json
      $.ajax({
        url: filepath + "_info.json",
        dataType: "json",
        success: function (data) {

          // Display info
          $("#title").text(data["title"]);
          $("#date").text(data["recorded_at"] + " - " + data["duration"]);
          for (var i = 0; i < data["moments"].length; i++) {
            var game = data["moments"][i];
            if (game["type"] == "GAME_CHANGE") {
              playedGameItems.push({
                startTime: game["offset"],
                endTime: game["offset"] + game["duration"],
                text: game["name"].trim()
              });
            }
          }
          var date = new Date(data["recorded_at"]);
          var options = { year: 'numeric', month: 'long', day: 'numeric' };
          extraTitleStuff = " w/ Chat - (" + data["user_name"] + ") - " + date.toLocaleDateString('en-US', options)

          // This will load our subtitles
          // https://github.com/pavladan/subtitles-parser-vtt/blob/master/index.js#L17
          $.ajax({
            url: filepath + ".vtt",
            dataType: "text",
            success: function (data) {
              data = data.replace(/\r/g, "");
              // Improved regex that handles multiline subtitles properly
              // The key fix: use [\s\S]*? (non-greedy) instead of .*\n to capture multiline text
              // Matches until we see a blank line, next timestamp pattern, or end of string
              // Using RegExp constructor to avoid formatter breaking the regex literal
              var regexPattern = "(?:^|\\n)(?:(\\d+)\\n)?(\\d{2}:\\d{2}:\\d{2}[,.]\\d{3})\\s*-->\\s*(\\d{2}:\\d{2}:\\d{2}[,.]\\d{3})\\n([\\s\\S]*?)(?=\\n\\n|\\n(?:\\d+\\n)?\\d{2}:\\d{2}:\\d{2}[,.]\\d{3}\\s*-->|$)";
              var regex = new RegExp(regexPattern, "g");
              var items = [];
              var match;
              while ((match = regex.exec(data)) !== null) {
                var text = match[4] ? match[4].trim() : "";
                if (text.length === 0) continue;
                items.push({
                  id: match[1] ? +match[1].trim() : items.length + 1,
                  startTime: timeMs(match[2].trim()) / 1000.0,
                  endTime: timeMs(match[3].trim()) / 1000.0,
                  text: text,
                  index: items.length,
                });
              }
              transcriptItems = items;

              // Initialize transcript window with first item (or time 0)
              if (transcriptItems.length > 0) {
                var initialTime = transcriptItems[0]["startTime"];
                updateTranscriptWindow(initialTime);
              }
            },
            error: function () {
              for (var i = 0; i < playedGameItems.length; i++) {
                var gameTime = playedGameItems[i]["startTime"];
                $("#transcript").append("<h4 id=\"game_" + i + "\" style=\"margin-top:1rem;cursor:pointer;text-decoration:underline;\" class=\"fw-bold text-warning\" onclick=\"onGamePlayedSeekClick(" + gameTime + ",'game_" + i + "');\">" + createTimestampSpan(gameTime) + playedGameItems[i]["text"] + '</h4>');
              }

            }
          });



        }
      });


    });
  </script>
